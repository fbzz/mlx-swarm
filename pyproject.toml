[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-swarm"
version = "0.5.0"
description = "Frontier-commanded DAGs of bounded local MLX workers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["agents", "mlx", "local-llm", "dag", "apple-silicon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx>=0.31.2",
    "mlx-lm>=0.31.2",
    "huggingface-hub>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mlx-swarm = "mlx_swarm.cli:main"
swarm = "mlx_swarm.cli:main"

[project.urls]
Homepage = "https://github.com/fbzz/mlx-swarm"
Repository = "https://github.com/fbzz/mlx-swarm.git"
Issues = "https://github.com/fbzz/mlx-swarm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlx_swarm = [
    "ui_static/*.html",
    "ui_static/*.css",
    "ui_static/*.js",
    "bundled_skills/mlx-swarm-commander/SKILL.md",
    "bundled_skills/mlx-swarm-commander/agents/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
